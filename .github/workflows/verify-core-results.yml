name: Verify core separating results

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.json'
      - '.github/workflows/verify-core-results.yml'
  pull_request:
    paths:
      - '*.py'
      - '*.json'
      - '.github/workflows/verify-core-results.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Verify binary vector-space seeds
        run: python verify_f2_6.py

      - name: Verify C3 cubed upper-bound certificate
        run: python verify_abelian_certificate.py c3xc3xc3_size6_certificate.json

      - name: Verify C3 fourth-power exact upper-bound certificate
        run: python verify_abelian_certificate.py c3four_size7_certificate.json

      - name: Verify C5 cubed exact size-seven certificate
        run: python verify_abelian_certificate.py c5cubed_size7_certificate.json

      - name: Verify historical C5 cubed size-eight certificate
        run: python verify_abelian_certificate.py c5cubed_size8_certificate.json
